<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --ok: #1e9e4a; --bad: #c62828; --muted: #8a8f98; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px 14px; width: 260px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.connected { background: var(--ok); } .dot.error { background: var(--bad); }
  #detail { color: var(--muted); margin: 6px 0 10px; min-height: 1em; }
  button { font: inherit; padding: 4px 10px; cursor: pointer; }
  footer { color: var(--muted); font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Mediator for Chrome</h1>
  <div class="row"><span id="dot" class="dot"></span><strong id="state">…</strong></div>
  <div id="detail"></div>
  <button id="reconnect">Reconnect</button>
  <footer>Works only with the Mediator app on this PC. While Mediator acts in a tab, Chrome shows a "started debugging this browser" bar.<br><span id="version"></span></footer>
  <script src="popup.js"></script>
</body>
</html>
