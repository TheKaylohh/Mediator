<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mediator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #f4f5f7; --line: #e2e4e8; --text: #1d1f23; --muted: #6b7280;
    --accent: #2f6fde; --on-accent: #ffffff; --ok: #1e9e4a; --bad: #c62828; --user: #e8effc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1c1f; --panel: #24262a; --line: #34373d; --text: #e7e8ea; --muted: #9aa0a8;
            --accent: #5b8ff0; --on-accent: #0d1117; --user: #253553; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13.5px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.connected { background: var(--ok); } .dot.error, .dot.unpaired { background: var(--bad); }
  .ghost { font: inherit; font-size: 12px; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .ghost:hover { background: var(--panel); }
  #status { font-size: 12px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); display: none; }
  #status.show { display: block; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .empty { color: var(--muted); margin: auto 0; text-align: center; padding: 0 8px; }
  .empty strong { color: var(--text); display: block; font-size: 15px; margin-bottom: 6px; }
  .msg { max-width: 100%; overflow-wrap: anywhere; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user); border-radius: 12px 12px 2px 12px; padding: 7px 11px; max-width: 88%; }
  .bot { align-self: stretch; }
  .bot.error { color: var(--bad); }
  .meta { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .steps { font-size: 12px; color: var(--muted); }
  .narration { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .bot code { background: var(--panel); border-radius: 4px; padding: 0 4px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .working::after { content: "…"; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
  .chip { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  form { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
             padding: 7px 9px; min-height: 36px; max-height: 160px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  #send { font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  #send.stop { background: var(--bad); color: #ffffff; }
  footer { font-size: 11px; color: var(--muted); padding: 0 12px 8px; }
</style>
</head>
<body>
  <header>
    <span id="dot" class="dot" title="Connection to the Mediator app"></span>
    <h1>Mediator</h1>
    <button id="newchat" class="ghost" type="button" title="Start a new chat">New chat</button>
  </header>
  <div id="status"><span id="statusText"></span> <button id="reconnect" class="ghost" type="button">Reconnect</button></div>
  <div id="log">
    <div class="empty" id="empty"><strong>Ask about this page</strong>Mediator works in the tab next to this panel, using your Claude or Gemini subscription in the Mediator app.</div>
  </div>
  <div id="chips">
    <button class="chip" type="button" data-text="Help me answer the question on this page: walk me through it, but let me pick the answer.">Help me answer</button>
    <button class="chip" type="button" data-text="Teach me the topic on this page from the basics, with a short example, then quiz me on it.">Teach me this</button>
    <button class="chip" type="button" data-text="Answer the questions on this page for me, then tell me why each answer is right. Don't submit.">Answer for me</button>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask Mediator about this tab…" aria-label="Message"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <footer id="version"></footer>
  <script src="sidepanel.js"></script>
</body>
</html>
